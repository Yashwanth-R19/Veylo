<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Veylo — verifiable acceptance for software deliverables. Criteria signed before work begins; acceptance decided by reproducible, deterministic checks, not a discretionary score." />
  <title>Veylo — Verifiable Acceptance for Software Deliverables</title>
  <script>
    // Stamp the stored theme before first paint so there's no flash of the
    // wrong theme while React hydrates (ThemeProvider reads the same key).
    (function () {
      try {
        var stored = window.localStorage.getItem('veylo-theme')
        document.documentElement.setAttribute('data-theme', stored === 'light' ? 'light' : 'dark')
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark')
      }
    })()
  </script>
</head>

<body style="background-color: #0B0C0E; color: #C7CCD2;">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
